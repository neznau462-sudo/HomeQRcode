name: Build HomeQRcode APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check Python syntax
        run: |
          python -m compileall -q main.py database.py storage_utils.py crypto_utils.py screens
          echo "syntax OK"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf automake libtool libltdl-dev pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake ninja-build \
            libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install buildozer==1.6.0

      - name: Build with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeQRcode-APK
          path: bin/*.apk
