name: Build HomeQRcode APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check Python syntax
        run: |
          python -m compileall -q main.py database.py storage_utils.py \
            crypto_utils.py ui_theme.py backup_utils.py screens
          echo "syntax OK"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf automake libtool libltdl-dev pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake ninja-build \
            libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install buildozer==1.6.0

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 || secrets.DEBUG_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWD || 'android' }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEYALIAS || 'androiddebugkey' }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Keystore secret is empty. Add RELEASE_KEYSTORE_B64 (or DEBUG_KEYSTORE_B64) in repository secrets."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          keytool -list -keystore release.keystore -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" > /dev/null
          echo "Signing key restored (alias: $KEY_ALIAS)"

      - name: Build release APK
        env:
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/release.keystore
          P4A_RELEASE_KEYALIAS: ${{ secrets.RELEASE_KEYALIAS || 'androiddebugkey' }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.RELEASE_KEYSTORE_PASSWD || 'android' }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.RELEASE_KEYALIAS_PASSWD || secrets.RELEASE_KEYSTORE_PASSWD || 'android' }}
        run: |
          buildozer android release

      - name: Verify APK signature
        run: |
          APK=$(ls bin/*.apk | head -n 1)
          echo "APK: $APK"
          case "$APK" in
            *release-unsigned*)
              echo "::error::APK is unsigned - keystore variables were not picked up"
              exit 1
              ;;
          esac
          APKSIGNER=$(find "$HOME/.buildozer" -path '*/build-tools/*/apksigner' -type f 2>/dev/null | sort -V | tail -n 1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Remove keystore from workspace
        if: always()
        run: rm -f release.keystore

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeQRcode-release
          path: bin/*.apk
